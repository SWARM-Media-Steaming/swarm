[workspace]

[package]
name = "adversarial-issue-389-active-playback-retry"
description = "Adversarial UAT for issue #389: an opened playback plan must survive a same-device retry."
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
