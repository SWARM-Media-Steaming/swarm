[package]
name = "swarm-server"
description = "SWARM desktop media server. The server runs inside the Tauri application."
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "swarm-server-app"

[[bin]]
name = "swarm-server-app"
path = "src/gui.rs"
required-features = ["gui"]

[[bin]]
name = "migrate-whisper-subtitles"
path = "src/bin/migrate_whisper_subtitles.rs"

[[bin]]
name = "fix-movies-layout"
path = "src/bin/fix_movies_layout.rs"

[features]
default = ["gui"]
gui = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog", "dep:tauri-plugin-opener", "dep:tauri-plugin-single-instance", "dep:tauri-plugin-updater", "dep:tauri-plugin-process", "dep:keepawake", "dep:rmcp", "dep:schemars"]

[dependencies]
swarm-core = { workspace = true }
swarm-p2p = { path = "../../crates/swarm-p2p" }
swarm-media = { path = "../../crates/swarm-media" }
swarm-stun-client = { path = "../../crates/swarm-stun-client" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = "0.2"
tower-http = { version = "0.6", features = ["trace"] }
rand = { workspace = true }
hex = { workspace = true }
quinn = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }
futures-util = { workspace = true }
bytes = { workspace = true }
sha1 = "0.10"
sha2 = { workspace = true }
whisper-rs = { version = "0.16", features = ["tracing_backend"] }
mdns-sd = "0.21"
# Not gui-gated (unlike mcp.rs's use of it): the new HTTP media/pairing
# surface it backs runs unconditionally from ServerCore::start, the same as
# the QUIC listener and LAN pairing, not just from the Tauri GUI's opt-in
# MCP feature — see http_media.rs.
axum = { version = "0.8" }
tauri = { version = "2", features = ["tray-icon"], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }
keepawake = { version = "0.6.1", optional = true }
rmcp = { version = "3", features = ["transport-streamable-http-server"], optional = true }
schemars = { version = "1", optional = true }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
axum-server = { version = "0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[dev-dependencies]
stun-server = { path = "../stun-server" }
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls"] }
flate2 = { workspace = true }
# Cargo unifies this with the [dependencies] tauri entry (gated behind the
# `gui` feature) for test builds only — `test` never reaches a production
# `cargo build --release`, which doesn't pull in [dev-dependencies] at all.
# See gui.rs's tauri_command_tests module.
tauri = { version = "2", features = ["test"] }
tempfile = "3"
