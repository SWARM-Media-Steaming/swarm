[workspace]

[package]
name = "adversarial-issue-384-switch-title-clean-release"
description = "Adversarial UAT for issue #384: same-owner cross-title negotiation must still reap a claimed-but-abandoned session even when that session's last range read completed cleanly."
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
bytes = "1"
futures-util = "0.3"
serde_json = "1"
swarm-core = { path = "../../../crates/swarm-core" }
swarm-media = { path = "../../../crates/swarm-media" }
tokio = { version = "1", features = ["full", "test-util"] }
